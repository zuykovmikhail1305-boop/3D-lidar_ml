[project]
name = "lidar-obstacle-monitor"
version = "0.1.0"
description = "3D visualization of LiDAR point cloud and obstacle probabilities in front of a metro train"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pyside6-project]
files = ["mainwindow.py", "form.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
